; ==========================================================================
; Video Voice Translator - 前端服务
; 监听端口：5173（默认），可通过环境变量 FRONTEND_PORT 覆盖
; ==========================================================================

[program:vvt-frontend]
command             = %(ENV_PROJECT_ROOT)s/scripts/run_frontend_foreground.sh
directory           = %(ENV_PROJECT_ROOT)s/frontend
environment         = PROJECT_ROOT="%(ENV_PROJECT_ROOT)s"
user                = %(ENV_USER)s

; 启停参数
autostart           = true
autorestart         = true
startsecs           = 5
startretries        = 5
stopwaitsecs        = 15
stopsignal          = TERM

; stdout/stderr
stdout_logfile      = %(ENV_PROJECT_ROOT)s/data/logs/supervisor/frontend.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups = 10
stderr_logfile      = %(ENV_PROJECT_ROOT)s/data/logs/supervisor/frontend.err.log
stderr_logfile_maxbytes = 50MB
stderr_logfile_backups = 5

; 子进程组一起 kill（node 有一堆子进程）
killasgroup         = true
stopasgroup         = true

; 启动顺序：先后端再前端（backend priority 更低更先启动）
priority            = 20
