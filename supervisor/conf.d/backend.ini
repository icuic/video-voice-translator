; ==========================================================================
; Video Voice Translator - 后端服务
; 监听端口：8000（默认），可通过环境变量 BACKEND_PORT 覆盖
; ==========================================================================

[program:vvt-backend]
command             = %(ENV_PROJECT_ROOT)s/scripts/run_backend_foreground.sh
directory           = %(ENV_PROJECT_ROOT)s
environment         = PROJECT_ROOT="%(ENV_PROJECT_ROOT)s",INDEX_TTS_DIR="%(ENV_PROJECT_ROOT)s/index-tts",DEV_MODE="0"
user                = %(ENV_USER)s

; 启停参数
autostart           = true
autorestart         = true               ; 进程崩溃自动重启
startsecs           = 5                   ; 启动后保持运行 5 秒才算成功
startretries        = 5                   ; 最多重试 5 次
stopwaitsecs        = 30                  ; 等 30 秒后再强杀
stopsignal          = TERM                ; 先 TERM，30 秒后再 KILL

; stdout/stderr 都重定向到 supervisord 日志系统（还会再存一份到文件）
stdout_logfile      = %(ENV_PROJECT_ROOT)s/data/logs/supervisor/backend.log
stdout_logfile_maxbytes = 100MB
stdout_logfile_backups = 10
stderr_logfile      = %(ENV_PROJECT_ROOT)s/data/logs/supervisor/backend.err.log
stderr_logfile_maxbytes = 50MB
stderr_logfile_backups = 5

; 子进程组一起 kill（避免残留）
killasgroup         = true
stopasgroup         = true

; 自定义
priority            = 10
