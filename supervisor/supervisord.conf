[unix_http_server]
file=%(ENV_PROJECT_ROOT)s/data/run/supervisor.sock
chmod=0700

[supervisord]
logfile=%(ENV_PROJECT_ROOT)s/data/logs/supervisord.log
pidfile=%(ENV_PROJECT_ROOT)s/data/run/supervisord.pid
childlogdir=%(ENV_PROJECT_ROOT)s/data/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_PROJECT_ROOT)s/data/run/supervisor.sock

[program:vvt-backend]
directory=%(ENV_PROJECT_ROOT)s
command=%(ENV_PROJECT_ROOT)s/index-tts/.venv/bin/python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --log-level info
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_PROJECT_ROOT)s/data/logs/backend.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=%(ENV_PROJECT_ROOT)s/data/logs/backend.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=PYTHONPATH="%(ENV_PROJECT_ROOT)s/index-tts",HF_ENDPOINT="https://hf-mirror.com",HF_HOME="%(ENV_PROJECT_ROOT)s/index-tts/.cache/hf",HF_HUB_CACHE="%(ENV_PROJECT_ROOT)s/index-tts/.cache/hf",TRANSFORMERS_CACHE="%(ENV_PROJECT_ROOT)s/index-tts/.cache/hf",PYTHONUNBUFFERED="1",PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION="python"

[program:vvt-frontend]
directory=%(ENV_PROJECT_ROOT)s/frontend
command=node ./node_modules/vite/bin/vite.js --host 0.0.0.0 --port 5173
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_PROJECT_ROOT)s/data/logs/frontend.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=%(ENV_PROJECT_ROOT)s/data/logs/frontend.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
