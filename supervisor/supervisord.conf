; ==========================================================================
; Video Voice Translator - Supervisor 主配置
; 用法：
;   # 前台启动 supervisord（调试）
;   supervisord -c supervisor/supervisord.conf
;
;   # 后台启动 supervisord（生产）
;   supervisord -c supervisor/supervisord.conf
;
;   # 用管理脚本（推荐）：./manage-supervisor.sh start | stop | status | restart
; ==========================================================================

[unix_http_server]
file=%(here)s/../data/run/supervisor.sock    ; UNIX socket 路径
chmod=0700                                   ; socket 文件权限

[supervisord]
logfile=%(here)s/../data/logs/supervisor/supervisord.log   ; supervisord 自身日志
logfile_maxbytes=50MB                                   ; 单日志文件最大 50MB
logfile_backups=10                                      ; 保留 10 个轮转
loglevel=info
pidfile=%(here)s/../data/run/supervisord.pid            ; PID 文件
nodaemon=false                                          ; 作为 daemon 运行（设为 true 则前台运行，用于调试）
minfds=1024
minprocs=200
user=%(ENV_USER)s                                       ; 以当前用户运行（通过环境变量注入，见 manage-supervisor.sh）
directory=%(here)s/..                                   ; 工作目录 = 项目根目录
strip_ansi=false                                        ; 保留 ANSI 颜色

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../data/run/supervisor.sock   ; 通过 unix socket 连接，不需要密码

; 加载 conf.d/ 下所有程序配置
[include]
files = %(here)s/conf.d/*.ini
